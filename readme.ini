如何使用与扩展
运行 Q1 (基准): 默认执行 solve_q1()，此时 SimulationContext.is_stochastic = False。所有公式使用均值，结果是确定的。
运行 Q2 (随机性): solve_q2() 实例化一个新的 Context，设置 is_stochastic = True。此时：
火箭载荷会乘以截断正态分布的天气因子。
电梯会计算 k_swing，如果运气不好触发阈值，elevator.port_status 会变为 5 (维修5年)，这5年内该港口产出为0且产生维修费。
运行 Q3 (水): 独立模块，依赖模拟器跑出的“完工年份”来决定当时的技术水平（运费）。
运行 Q4 (环境): 打开 calc_environmental_impact 开关。模拟器会在每一步累加 env_impact。你可以调整 config.py 中的 ENV_CO2_PER_LAUNCH 等权重来改变结果。

模型的优越性
解耦: 物理逻辑（火箭怎么飞）和 业务逻辑（怎么调度火箭和电梯）分离。
可解释性: 所有常量都在 config.py，公式都在 models/。
灵活性: 题目问“如果火箭坏了怎么办？”，只需在 models/rocket.py 的 step_year 里加一行 if random < 0.01: capacity = 0 即可，不需要动主循环。